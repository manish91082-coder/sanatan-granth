name: swarm-conduct

# स्वार्म के संचालक का एक चक्कर (tools/swarm/conductor.py): कतार (swarm/BACKLOG.json) से अगला काम चुनकर Foreman को देता है
# और branch 'swarm-state' में STATUS.md लिखता है। संचालक कोई मॉडल-अनुरोध नहीं करता।
#
# मुख्य घड़ी Foreman है (हर 20 मिनट पर 'conduct' job → foreman-job)। यह workflow दूसरी, स्वतंत्र घड़ी है:
#   - schedule: GitHub का समय-निर्धारण इस repo में घंटों देर से चलता है, इसलिए यह केवल पीछे की रस्सी है
#     (Foreman बंद हो जाए तो भी संचालक चले और issue खोले);
#   - workflow_dispatch: हाथ से, और काम ख़त्म होने पर foreman-job से (जब तक Foreman 'conduct' नहीं जानता)।
# दोनों रास्ते एक ही concurrency-समूह में हैं; संचालक idempotent है (वही काम दो बार कतार में नहीं जाता)।

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-conduct
  cancel-in-progress: false

jobs:
  conduct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      SWARM_STATE_DIR: ${{ github.workspace }}/.cache/swarm-state
      STATE_TOKEN: ${{ secrets.FOREMAN_DISPATCH_TOKEN }}
      FOREMAN_URL: ${{ vars.FOREMAN_URL }}
      FOREMAN_SHARED_SECRET: ${{ secrets.FOREMAN_SHARED_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: संचालक का चक्कर
        run: bash tools/swarm/ci_conduct.sh
