name: foreman-job

# Foreman (Cloudflare) repository_dispatch से एक job भेजता है; यह workflow उसे चलाकर नतीजा HMAC-हस्ताक्षर के साथ
# Foreman को लौटाता है (मास्टर योजना §5.1)।
# steps:
#   noop        ख़ाली चक्कर (आत्म-परीक्षा)
#   conduct     स्वार्म का संचालक: कतार (swarm/BACKLOG.json) से अगला काम चुनकर Foreman को देता है (tools/swarm/conductor.py)
#   pilot_e2e   एक ग्रंथ पर पूरी कड़ी (tools/pilot/ci_run.sh)
#   judge_test  जजों की canary-परीक्षा (tools/pilot/ci_judge_test.sh)
# स्वार्म की हालत (सेहत-बही, कतार की स्थिति, अधूरे काम) branch 'swarm-state' में रहती है (tools/swarm/state_sync.sh)।
# कोई job इंसान का इंतज़ार नहीं करता। अलग-अलग steps (acquire, witness_diff ...) P3 में यहीं जुड़ेंगे।

on:
  repository_dispatch:
    types: [foreman-job]

permissions:
  contents: read

concurrency:
  # संचालक के चक्कर एक के बाद एक (कतार की स्थिति का एक ही लेखक); बाक़ी jobs अपनी job_key पर
  group: ${{ github.event.client_payload.step == 'conduct' && 'swarm-conduct' || format('foreman-{0}', github.event.client_payload.job_key) }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write    # संचालक: काम अटके तो मालिक के लिए issue
      actions: write   # काम ख़त्म होने पर संचालक का workflow जगाना (जब तक Foreman 'conduct' नहीं जानता)
    env:
      JOB_KEY: ${{ github.event.client_payload.job_key }}
      STEP: ${{ github.event.client_payload.step }}
      TEXT_ID: ${{ github.event.client_payload.text_id }}
      BATCH_ID: ${{ github.event.client_payload.batch_id }}
      CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
      SWARM_STATE_DIR: ${{ github.workspace }}/.cache/swarm-state
      STATE_TOKEN: ${{ secrets.FOREMAN_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: payload की जाँच (payload डेटा है, निर्देश नहीं)
        run: |
          set -euo pipefail
          [[ "$JOB_KEY" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::job_key अमान्य"; exit 1; }
          [[ "$STEP" =~ ^[a-z0-9_]{2,20}$ ]] || { echo "::error::step अमान्य"; exit 1; }
          [[ "$TEXT_ID" =~ ^[a-z][a-z0-9_]{0,40}$ ]] || { echo "::error::text_id अमान्य"; exit 1; }
          [[ "$BATCH_ID" =~ ^[A-Za-z0-9_.:-]{1,80}$ ]] || { echo "::error::batch_id अमान्य"; exit 1; }
          [[ "$CALLBACK_URL" =~ ^https://[a-z0-9.-]+\.workers\.dev/callback$ ]] || { echo "::error::callback_url अमान्य"; exit 1; }
      - uses: actions/setup-python@v5
        if: env.STEP != 'noop'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: checks/requirements.txt
      - if: env.STEP == 'pilot_e2e' || env.STEP == 'judge_test'
        run: pip install -q -r checks/requirements.txt
      - name: स्वार्म की हालत लाएँ
        if: env.STEP == 'pilot_e2e' || env.STEP == 'judge_test'
        run: bash tools/swarm/state_sync.sh pull
      - name: step चलाएँ
        id: step
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PR_TOKEN: ${{ secrets.FOREMAN_DISPATCH_TOKEN }}
          FOREMAN_URL: ${{ vars.FOREMAN_URL }}
          FOREMAN_SHARED_SECRET: ${{ secrets.FOREMAN_SHARED_SECRET }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          START=$(date +%s)
          RC=0
          case "$STEP" in
            noop)
              echo "ख़ाली batch: कुछ नहीं करना"
              { echo "status=done"; echo "ref=run:${GITHUB_RUN_ID}"; } >> "$GITHUB_OUTPUT" ;;
            conduct)
              bash tools/swarm/ci_conduct.sh || RC=$?
              { echo "status=$([ "$RC" -eq 0 ] && echo done || echo failed)"; echo "ref=run:${GITHUB_RUN_ID}"; } >> "$GITHUB_OUTPUT" ;;
            pilot_e2e)
              bash tools/pilot/ci_run.sh "$TEXT_ID" "$BATCH_ID" "$JOB_KEY" no || RC=$? ;;
            judge_test)
              bash tools/pilot/ci_judge_test.sh "$TEXT_ID" yes || RC=$?
              { echo "status=$([ "$RC" -eq 0 ] && echo done || echo failed)"; echo "ref=run:${GITHUB_RUN_ID}"; echo "rc=$RC"; } >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::step '$STEP' अभी लागू नहीं"
              { echo "status=failed"; echo "ref=run:${GITHUB_RUN_ID}"; } >> "$GITHUB_OUTPUT"; RC=1 ;;
          esac
          echo "duration=$(( $(date +%s) - START ))" >> "$GITHUB_OUTPUT"
          exit "$RC"
      - name: नतीजा स्वार्म की हालत में दर्ज करें और संचालक को जगाएँ
        if: always() && (env.STEP == 'pilot_e2e' || env.STEP == 'judge_test')
        env:
          RC: ${{ steps.step.outputs.rc || '1' }}
          REF: ${{ steps.step.outputs.ref || 'run:unknown' }}
          FOREMAN_URL: ${{ vars.FOREMAN_URL }}
          FOREMAN_SHARED_SECRET: ${{ secrets.FOREMAN_SHARED_SECRET }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          [[ "$RC" =~ ^-?[0-9]+$ ]] || RC=1
          [[ "$REF" =~ ^[A-Za-z0-9_.:/-]{1,120}$ ]] || REF="run:${GITHUB_RUN_ID}"
          git checkout -q --detach 2>/dev/null || true
          python -m tools.swarm.conductor report --batch "$BATCH_ID" --step "$STEP" --text "$TEXT_ID" --rc "$RC" --ref "$REF" --report-dir /tmp/pilot/report || true
          bash tools/swarm/state_sync.sh push "$STEP $BATCH_ID: rc $RC" || true
          python -m tools.swarm.conductor kick || true
      - uses: actions/upload-artifact@v4
        if: always() && (env.STEP == 'pilot_e2e' || env.STEP == 'judge_test')
        with:
          name: pilot-report-${{ github.event.client_payload.text_id }}
          path: /tmp/pilot/report/
          retention-days: 30
          if-no-files-found: ignore
      - name: Foreman को नतीजा लौटाएँ
        if: always()
        env:
          FOREMAN_SHARED_SECRET: ${{ secrets.FOREMAN_SHARED_SECRET }}
          STATUS: ${{ steps.step.outputs.status || 'failed' }}
          REF: ${{ steps.step.outputs.ref || 'run:unknown' }}
          DURATION: ${{ steps.step.outputs.duration || 0 }}
        run: |
          set -euo pipefail
          [[ "$STATUS" =~ ^(done|failed)$ ]] || STATUS=failed
          [[ "$REF" =~ ^[A-Za-z0-9_.:/-]{1,120}$ ]] || REF="run:${GITHUB_RUN_ID}"
          [[ "$DURATION" =~ ^[0-9]+$ ]] || DURATION=0
          BODY=$(printf '{"job_key":"%s","status":"%s","result_ref":"%s","duration_s":%s}' "$JOB_KEY" "$STATUS" "$REF" "$DURATION")
          SIG=$(printf '%s' "$BODY" | openssl dgst -sha256 -hmac "$FOREMAN_SHARED_SECRET" -r | cut -d' ' -f1)
          curl -sS --fail-with-body --retry 3 -X POST "$CALLBACK_URL" \
               -H "content-type: application/json" -H "x-foreman-signature: $SIG" --data "$BODY"
