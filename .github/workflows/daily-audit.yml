name: daily-audit

# रोज़ 05:00 IST (23:30 UTC): R1–R14 + canaries → branch 'audit-log' में audit/daily/YYYY-MM-DD.json (मास्टर योजना §5.7, §7.1)।
# लाल हो तो issue खुलता है। कोई canary छूटे तो swarm/STOP का प्रस्ताव issue में जाता है;
# Foreman अपनी ओर से हर tick पर canary-नतीजा पढ़कर रुकता है।

on:
  schedule:
    - cron: "30 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: checks/requirements.txt
      - run: pip install -q -r checks/requirements.txt
      - name: जाँचें चलाएँ
        id: run
        run: |
          set +e
          DAY="$(date -u +%F)"
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          python -m checks.run_all --out "audit/daily/$DAY.json"; echo "checks=$?" >> "$GITHUB_OUTPUT"
          python -m checks.canary_test | tee /tmp/canary.txt; echo "canary=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          python - "$DAY" <<'PY'
          import json, sys, pathlib
          p = pathlib.Path(f"audit/daily/{sys.argv[1]}.json")
          rep = json.loads(p.read_text(encoding="utf-8"))
          last = pathlib.Path("/tmp/canary.txt").read_text(encoding="utf-8").strip().splitlines()[-1]
          try:
              rep["canaries"] = json.loads(last)
          except Exception:
              rep["canaries"] = {"error": "canary-नतीजा पढ़ा नहीं जा सका"}
          p.write_text(json.dumps(rep, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: रिपोर्ट को audit-log branch पर रखें (PR नहीं)
        # GITHUB_TOKEN से बने PR के checks "approval" पर अटकते हैं (पहला run, PR #11), इसलिए
        # दैनिक रिपोर्ट main में नहीं, अलग branch 'audit-log' पर सीधे जाती है। main का ताला वैसा ही रहता है।
        run: |
          set -euo pipefail
          DAY="${{ steps.run.outputs.day }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp "audit/daily/$DAY.json" /tmp/report.json
          if git fetch -q origin audit-log; then
            git worktree add -q /tmp/al FETCH_HEAD
            cd /tmp/al && git checkout -q -B audit-log
          else
            git worktree add -q --detach /tmp/al
            cd /tmp/al && git checkout -q --orphan audit-log && git rm -q -rf . >/dev/null
          fi
          mkdir -p audit/daily && cp /tmp/report.json "audit/daily/$DAY.json"
          git add "audit/daily/$DAY.json"
          if git diff --cached --quiet; then echo "कोई बदलाव नहीं"; exit 0; fi
          git commit -q -m "audit: दैनिक script-ऑडिट $DAY"
          git push -q origin audit-log
      - name: लाल हो तो issue
        if: steps.run.outputs.checks != '0' || steps.run.outputs.canary != '0'
        run: |
          DAY="${{ steps.run.outputs.day }}"
          if [ "${{ steps.run.outputs.canary }}" = "2" ]; then
            TITLE="CANARY छूटा $DAY: स्वार्म रोकें"; LABEL="needs-human"
          else
            TITLE="दैनिक ऑडिट लाल $DAY"; LABEL="red-audit"
          fi
          gh label create "$LABEL" --color B60205 >/dev/null 2>&1 || true
          gh issue create --title "$TITLE" --label "$LABEL" \
            --body "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} · रिपोर्ट: branch \`audit-log\` में \`audit/daily/$DAY.json\`। checks exit=${{ steps.run.outputs.checks }}, canary exit=${{ steps.run.outputs.canary }}."
          exit 1
