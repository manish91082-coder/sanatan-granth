name: foreman-deploy

# केवल मालिक हाथ से चलाए (Run workflow)। Claude कभी deploy नहीं करता (CLAUDE.md सीमा #1)।
# ज़रूरी GitHub secrets (मालिक डालें; docs/USER_STEPS_hi.md):
#   CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID · FOREMAN_SHARED_SECRET · FOREMAN_DISPATCH_TOKEN

on:
  workflow_dispatch:
    inputs:
      create_d1:
        description: "पहली बार: D1 database बनाएँ (yes/no)"
        default: "no"

permissions:
  contents: read

concurrency:
  group: foreman-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: foreman
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: foreman/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: D1 database (पहली बार)
        if: inputs.create_d1 == 'yes'
        run: npx wrangler d1 create sanatan-granth-ledger || true
      - name: D1 की ID wrangler config में
        run: |
          set -euo pipefail
          ID=$(npx wrangler d1 list --json | python3 -c "import json,sys; print(next(d['uuid'] for d in json.load(sys.stdin) if d['name']=='sanatan-granth-ledger'))")
          sed -i "s/REPLACED_AT_DEPLOY/$ID/" wrangler.jsonc
      - run: npx wrangler d1 migrations apply sanatan-granth-ledger --remote
      - name: deploy
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy.txt
          URL=$(grep -o 'https://[a-z0-9.-]*\.workers\.dev' /tmp/deploy.txt | head -1)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: secrets Cloudflare में
        run: |
          set -euo pipefail
          printf '%s' "${{ secrets.FOREMAN_SHARED_SECRET }}" | npx wrangler secret put FOREMAN_SHARED_SECRET
          printf '%s' "${{ secrets.FOREMAN_DISPATCH_TOKEN }}" | npx wrangler secret put GITHUB_DISPATCH_TOKEN
      - name: smoke test (status-पन्ना; Foreman अपना पता यहीं से सीखता है)
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.url }}"
          curl -sS --fail --retry 5 --retry-delay 5 "$URL/status.json" | tee /tmp/status.json
          echo "### Foreman deploy हुआ" >> "$GITHUB_STEP_SUMMARY"
          echo "status-पन्ना: $URL/status" >> "$GITHUB_STEP_SUMMARY"
