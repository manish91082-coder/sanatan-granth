name: pilot-e2e

# P2 pilot: एक ग्रंथ पर पूरी कड़ी, हाथ से चलाने के लिए (Foreman के बिना)।
#   स्रोत → ID → ड्राफ़्ट A/B (अलग परिवार) → जज → cascade → पक्की जाँचें → C/D बैज → R-जाँचें → रिपोर्ट → डेटा-PR
# स्वचालित रास्ता: foreman-enqueue → Foreman → foreman-job (step=pilot_e2e); दोनों एक ही script चलाते हैं।
# संस्कृत पाठ artifact या repo में नहीं जाता; केवल रिपोर्ट (अनुवाद के मसौदे + hash + माप)।

on:
  workflow_dispatch:
    inputs:
      text_id:
        description: "ग्रंथ (अभी केवल isha)"
        default: "isha"
      mock:
        description: "नक़ली मॉडल (कोई API-call नहीं)? yes/no"
        default: "no"
      mode:
        description: "pipeline = पूरी कड़ी; bakeoff = ड्राफ़्टर-मॉडलों की तुलना (कोई PR नहीं); judgetest = जज-परीक्षा; batchab = batch-आकार की तुलना, गीता 1–2 (कोई PR नहीं)"
        default: "pipeline"
        type: choice
        options: [pipeline, bakeoff, judgetest, batchab]
      open_pr:
        description: "नतीजे का डेटा-PR खोलें? yes/no (branch पर परीक्षण के लिए no)"
        default: "yes"
      draft_a:
        description: "Draft A का मॉडल (ख़ाली = default), जैसे groq:qwen/qwen3.8-27b"
        default: ""
      draft_b:
        description: "Draft B का मॉडल (ख़ाली = default)"
        default: ""
      draft_c:
        description: "Draft C का मॉडल (ख़ाली = default)"
        default: ""
      judges:
        description: "जजों की सूची, अल्पविराम से (ख़ाली = default)"
        default: ""

permissions:
  contents: read

concurrency:
  group: pilot-e2e-${{ inputs.text_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # स्वार्म की सेहत-बही: हाथ के runs का ख़र्च भी दिन के हिस्से में गिना जाता है, और रुके मॉडल नहीं बुलाए जाते
      SWARM_STATE_DIR: ${{ github.workspace }}/.cache/swarm-state
      STATE_TOKEN: ${{ inputs.mock != 'yes' && secrets.FOREMAN_DISPATCH_TOKEN || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: checks/requirements.txt
      - run: pip install -q -r checks/requirements.txt
      - name: स्वार्म की हालत लाएँ
        if: inputs.mode == 'pipeline' || inputs.mode == 'judgetest'
        run: bash tools/swarm/state_sync.sh pull
      - name: पूरी कड़ी
        if: inputs.mode == 'pipeline'
        env:
          TEXT_ID: ${{ inputs.text_id }}
          MOCK: ${{ inputs.mock }}
          OPEN_PR: ${{ inputs.open_pr }}
          PILOT_DRAFT_A: ${{ inputs.draft_a }}
          PILOT_DRAFT_B: ${{ inputs.draft_b }}
          PILOT_DRAFT_C: ${{ inputs.draft_c }}
          PILOT_JUDGES: ${{ inputs.judges }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          PR_TOKEN: ${{ secrets.FOREMAN_DISPATCH_TOKEN }}
        run: bash tools/pilot/ci_run.sh "$TEXT_ID" "manual-${GITHUB_RUN_ID}" - "$MOCK" "$OPEN_PR"
      - name: जज-परीक्षा (बिगाड़े गए अनुवाद पकड़ना)
        if: inputs.mode == 'judgetest'
        env:
          TEXT_ID: ${{ inputs.text_id }}
          OPEN_PR: ${{ inputs.open_pr }}
          JUDGES: ${{ inputs.judges }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          PR_TOKEN: ${{ secrets.FOREMAN_DISPATCH_TOKEN }}
        run: bash tools/pilot/ci_judge_test.sh "$TEXT_ID" "$OPEN_PR"
      - name: ड्राफ़्टर-मॉडलों की तुलना (bake-off)
        if: inputs.mode == 'bakeoff'
        env:
          TEXT_ID: ${{ inputs.text_id }}
          CANDIDATES: ${{ inputs.draft_a }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
        run: |
          [[ "$TEXT_ID" =~ ^[a-z][a-z0-9_]{0,40}$ ]] || { echo "::error::text_id अमान्य"; exit 2; }
          set -o pipefail
          python -m tools.pilot.bakeoff --text "$TEXT_ID" --out /tmp/pilot --candidates "$CANDIDATES" | tee /tmp/bakeoff_summary.json
          { echo '```json'; cat /tmp/bakeoff_summary.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: batch-आकार की तुलना (गीता अध्याय 1–2; P2 2.2)
        if: inputs.mode == 'batchab'
        env:
          MODELS: ${{ inputs.draft_a }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
        run: |
          set -o pipefail
          python -m tools.pilot.batch_ab --out /tmp/pilot --models "$MODELS" | tee /tmp/batch_ab_summary.json
          { echo '```json'; cat /tmp/batch_ab_summary.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: स्वार्म की हालत लौटाएँ
        if: always() && (inputs.mode == 'pipeline' || inputs.mode == 'judgetest')
        run: |
          git checkout -q --detach 2>/dev/null || true
          bash tools/swarm/state_sync.sh push "manual ${{ inputs.mode }} run ${GITHUB_RUN_ID}" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-report-${{ inputs.text_id }}
          path: /tmp/pilot/report/
          retention-days: 30
          if-no-files-found: ignore
