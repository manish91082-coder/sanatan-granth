name: secrets-check

# हर secret असली सेवा पर एक read-only अनुरोध से परखा जाता है। कोई key या उसका अंश कहीं नहीं छपता;
# केवल HTTP-स्थिति और हाँ/नहीं। कुछ बनाया या बदला नहीं जाता।

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FOREMAN_DISPATCH_TOKEN: ${{ secrets.FOREMAN_DISPATCH_TOKEN }}
      FOREMAN_SHARED_SECRET: ${{ secrets.FOREMAN_SHARED_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
    steps:
      - name: जाँच
        run: |
          python3 - <<'PY' | tee /tmp/secrets_check.json
          import base64, json, os, re, urllib.request, urllib.error
          def get(url, headers):
              req = urllib.request.Request(url, headers={"user-agent": "sanatan-granth-secrets-check", **headers})
              try:
                  with urllib.request.urlopen(req, timeout=40) as r:
                      return r.status, json.loads(r.read() or b"null")
              except urllib.error.HTTPError as e:
                  try: body = json.loads(e.read() or b"null")
                  except Exception: body = None
                  return e.code, body
              except Exception as e:
                  return 0, {"error": type(e).__name__}
          E = os.environ; out = {}
          shape = lambda v: {"set": bool(v), "len": len(v), "has_space_or_quote": bool(re.search(r"[\s\"']", v))}
          for k in ("KAGGLE_USERNAME","KAGGLE_KEY","GROQ_API_KEY","CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID","FOREMAN_DISPATCH_TOKEN","FOREMAN_SHARED_SECRET","GEMINI_API_KEY","OPENROUTER_API_KEY","SAMBANOVA_API_KEY"):
              out[k] = shape(E.get(k, ""))
          out["KAGGLE_KEY"]["looks_like"] = "KGAT-token" if E.get("KAGGLE_KEY","").startswith("KGAT_") else ("legacy-hex" if re.fullmatch(r"[0-9a-f]{32}", E.get("KAGGLE_KEY","")) else "other")
          out["CLOUDFLARE_ACCOUNT_ID"]["is_32_hex"] = bool(re.fullmatch(r"[0-9a-f]{32}", E.get("CLOUDFLARE_ACCOUNT_ID","")))
          # Kaggle: basic auth (पुराना रूप) और Bearer (नया token), दोनों आज़माएँ
          b = base64.b64encode(f"{E.get('KAGGLE_USERNAME','')}:{E.get('KAGGLE_KEY','')}".encode()).decode()
          s1, _ = get("https://www.kaggle.com/api/v1/kernels/list?page_size=1&user=" + E.get("KAGGLE_USERNAME",""), {"authorization": "Basic " + b})
          s2, _ = get("https://www.kaggle.com/api/v1/kernels/list?page_size=1&user=" + E.get("KAGGLE_USERNAME",""), {"authorization": "Bearer " + E.get("KAGGLE_KEY","")})
          out["kaggle"] = {"basic_auth_http": s1, "bearer_http": s2, "ok": 200 in (s1, s2)}
          s, j = get("https://api.groq.com/openai/v1/models", {"authorization": "Bearer " + E.get("GROQ_API_KEY","")})
          ids = sorted(m["id"] for m in (j or {}).get("data", [])) if s == 200 else []
          out["groq"] = {"http": s, "ok": s == 200, "models": len(ids), "gpt_oss": [i for i in ids if "gpt-oss" in i], "qwen": [i for i in ids if "qwen" in i.lower()]}
          cf = {"authorization": "Bearer " + E.get("CLOUDFLARE_API_TOKEN","")}
          acct = E.get("CLOUDFLARE_ACCOUNT_ID","")
          s, j = get("https://api.cloudflare.com/client/v4/user/tokens/verify", cf)
          s_acc, j_acc = get(f"https://api.cloudflare.com/client/v4/accounts/{acct}/tokens/verify", cf)
          s_w, _ = get(f"https://api.cloudflare.com/client/v4/accounts/{acct}/workers/scripts", cf)
          s_d, jd = get(f"https://api.cloudflare.com/client/v4/accounts/{acct}/d1/database", cf)
          s_sub, js = get(f"https://api.cloudflare.com/client/v4/accounts/{acct}/workers/subdomain", cf)
          out["cloudflare"] = {"user_token_verify_http": s, "account_token_verify_http": s_acc,
                               "token_active": ((j or {}).get("result") or {}).get("status") == "active" or ((j_acc or {}).get("result") or {}).get("status") == "active",
                               "workers_scripts_http": s_w, "d1_list_http": s_d, "d1_databases": len((jd or {}).get("result") or []) if s_d == 200 else None,
                               "workers_dev_subdomain_set": bool(((js or {}).get("result") or {}).get("subdomain")) if s_sub == 200 else None, "subdomain_http": s_sub}
          gh = {"authorization": "Bearer " + E.get("FOREMAN_DISPATCH_TOKEN",""), "accept": "application/vnd.github+json"}
          repo = os.environ["GITHUB_REPOSITORY"]
          s, j = get(f"https://api.github.com/repos/{repo}", gh)
          s_p, _ = get(f"https://api.github.com/repos/{repo}/pulls?per_page=1", gh)
          s_o, jo = get("https://api.github.com/user/repos?per_page=100", gh)
          out["dispatch_token"] = {"repo_http": s, "contents_write": bool(((j or {}).get("permissions") or {}).get("push")) if s == 200 else False,
                                   "pulls_read_http": s_p, "repos_visible_to_token": len(jo) if s_o == 200 and isinstance(jo, list) else None}
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
          { echo '```json'; cat /tmp/secrets_check.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: secrets-check
          path: /tmp/secrets_check.json
